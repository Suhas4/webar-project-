services:
  # ── Go Backend ─────────────────────────────────────────────────────────────
  - type: web
    name: webar-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://memoera.in
      # PORT is injected automatically by Render — do not add it here
      # Razorpay live keys — sync: false means Render won't store/overwrite
      # these from this file; set the actual values once in the dashboard
      # (Render → webar-backend → Environment) and never commit them here.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Where Razorpay returns the customer after a hosted payment link. Only
      # used by /api/payment/create-link; Standard Checkout doesn't need it.
      - key: RAZORPAY_CALLBACK_URL
        value: https://memoera.in
      # Admin identity. Compared against the MOBILE number on the auth token,
      # despite the legacy ADMIN_EMAIL name that is still read as a fallback.
      - key: ADMIN_MOBILE
        sync: false
