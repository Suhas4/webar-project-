<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google AdSense site verification -->
    <meta name="google-adsense-account" content="ca-pub-3826485527589023">
    <!--
      AdSense is deferred until after the load event rather than requested from
      <head>. Even with async, starting it here made it the single biggest drag
      on startup: the loader plus its follow-on requests are ~220 KB and they
      competed with the app's own bundle for both network and main thread.
      Measured on a throttled 4G phone, blocking ads entirely took load from
      1861ms to 662ms — deferring recovers most of that while ads still serve.

      Auto ads inject after load anyway, so pushing the config a second or so
      later costs nothing in impressions.
    -->
    <script>
      (function () {
        var started = false;
        function loadAds() {
          if (started) return;
          started = true;
          var s = document.createElement('script');
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3826485527589023';
          s.onload = function () {
            // Guarded: pushing enable_page_level_ads twice throws
            // "Only one 'enable_page_level_ads' allowed per page".
            if (window.__adsPushed) return;
            window.__adsPushed = true;
            try {
              (window.adsbygoogle = window.adsbygoogle || []).push({
                google_ad_client: "ca-pub-3826485527589023",
                enable_page_level_ads: true
              });
            } catch (e) { /* ad blockers and offline both land here */ }
          };
          document.head.appendChild(s);
        }
        // A further beat after load so the app finishes settling first.
        function schedule() { setTimeout(loadAds, 1200); }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Outfit is the interface font for every screen, so it stays on the
         critical path — deferring it would flash unstyled text app-wide. -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Display faces, used by the AI Poster Studio's text overlay picker and
         the catalog title styles — neither of which most sessions open. Loaded
         with media="print" so the browser fetches them at low priority without
         blocking render, then flipped to all once they arrive. -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Bebas+Neue&family=Pacifico&family=Anton&family=Cinzel:wght@700;900&family=Archivo+Black&family=Caveat:wght@700&family=Orbitron:wght@800&family=Poppins:wght@800&display=swap">

    <!--
      Import map — MUST be first in <head>, before any <script type="module">.

      MindAR's dist files are ES modules that do `import { ... } from "three"`.
      Browsers cannot resolve bare specifiers like "three" without an import map.
      Without this, dynamic import() of MindAR fails with:
        "Failed to resolve module specifier 'three'"

      WHY three@0.150.0:
      MindAR 1.2.5 uses `sRGBEncoding` which was removed in Three.js r152.
      r150 is the last compatible version. Our app's three npm package also
      uses 0.150.0 to stay in sync.
    -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/"
      }
    }
    </script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- iOS fullscreen / status bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Memoera — Bring Memories to Life with AR</title>
    <meta name="description" content="Memoera is an Augmented Reality platform from Bangalore. Scan any Memoera-linked image to experience AR videos, 3D models, and interactive content — no special glasses needed." />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.memoera.in" />
    <meta property="og:title"       content="Memoera — Bring Memories to Life" />
    <meta property="og:description" content="Scan images with Memoera to unlock hidden AR experiences. Upload your targets, attach videos or 3D models, and share instantly." />
    <meta property="og:image"       content="https://memoera.in/logo1.png" />
    <meta property="og:site_name"   content="Memoera" />
    <meta property="og:locale"      content="en_IN" />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Memoera — Augmented Reality Platform" />
    <meta name="twitter:description" content="Bring memories to life. Scan → AR." />
    <meta name="twitter:image"       content="https://memoera.in/logo1.png" />
    <meta name="twitter:site"        content="@Memo_Era" />

    <!-- Schema.org — tells Google Lens this logo = Memoera brand -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Memoera",
      "alternateName": "Memo Era",
      "url": "https://www.memoera.in",
      "logo": "https://memoera.in/logo1.png",
      "description": "Memoera is an Augmented Reality platform that brings memories to life. Scan any Memoera-linked image with your phone to unlock AR videos, 3D models, and interactive experiences.",
      "foundingLocation": {
        "@type": "Place",
        "addressLocality": "Bangalore",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9187713120",
        "email": "memoerabangalore@gmail.com",
        "contactType": "customer support"
      },
      "sameAs": [
        "https://www.instagram.com/memoerabangalore/",
        "https://www.facebook.com/profile.php?id=61574312286741",
        "https://www.youtube.com/@memoerabangalore",
        "https://x.com/Memo_Era"
      ]
    }
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: #040D0B;
        /* Prevent any white flash on load or between screens */
      }
      #root {
        /* Push all screens below the device status bar */
        padding-top: env(safe-area-inset-top, 0px);
        min-height: 100dvh;
        background: #040D0B;
      }
    </style>
  </head>
  <body>
    <!--
      #root stays empty on purpose.

      Content for crawlers is injected at the edge instead — see
      netlify/edge-functions/prerender.js. Putting it inline here was tried and
      measurably backfired: React's createRoot() clears the container, Chrome
      discards removed elements as LCP candidates, and the late HelloScreen
      paint it had been masking became LCP instead — 1064ms to ~5900ms, which
      fails Core Web Vitals and so costs more SEO than the markup gained.
    -->
    <div id="root"></div>
    <noscript>
      <div style="padding:24px;font-family:sans-serif;color:#F2F7F6;background:#040D0B">
        <h2>Memoera needs JavaScript</h2>
        <p>
          Memoera is an augmented reality platform — scan a printed photo to see
          video, 3D models and animations appear on it. Please enable JavaScript,
          or visit <a href="https://memoera.in" style="color:#00C9A7">memoera.in</a>
          in a modern browser.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
