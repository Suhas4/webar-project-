name: Keep backend warm

# Render's free tier sleeps a service after ~15 minutes of no traffic and
# takes 30-60+ seconds to cold-start on the next request, which can break
# an upload mid-flow ("Failed to fetch"). Pinging /health well inside that
# 15-minute window keeps the instance from ever fully sleeping.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf https://webar-project-8jbi.onrender.com/health || true
